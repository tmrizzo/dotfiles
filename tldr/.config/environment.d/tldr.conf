# tldr (official Python client) configuration — via environment variables.
# The client has no config file; all settings are TLDR_* env vars.
# Docs: https://github.com/tldr-pages/tldr-python-client#configuration
#
# Mirrors the tealdeer package settings: cache enabled, refreshed weekly.
# Loaded by the systemd user session, so it applies to bash and zsh alike.
# (Re-login or `systemctl --user import-environment` after changes.)

# Cache: use local cache first, fall back to the network (default 1)
TLDR_CACHE_ENABLED=1

# Maximum cache age in hours before a refresh is needed (weekly, like tealdeer)
TLDR_CACHE_MAX_AGE=168

# Platform pages to prefer (auto-detected when unset)
#TLDR_PLATFORM=linux

# Language for pages (falls back to English; RFC 1766 codes)
#TLDR_LANGUAGE=en

# Colors (font, background, effects). Uncomment to customize.
#TLDR_COLOR_NAME="cyan"
#TLDR_COLOR_DESCRIPTION="white"
#TLDR_COLOR_EXAMPLE="green"
#TLDR_COLOR_COMMAND="red"
#TLDR_COLOR_PARAMETER="white"

# Show short-form options (short | long | both)
#TLDR_OPTIONS=short
